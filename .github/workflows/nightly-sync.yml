name: Nightly data sync

# Prices, fundamentals, indicators and news from Yahoo Finance into Supabase,
# then refreshes public.stock_snapshot which the web app reads.
on:
  schedule:
    - cron: "30 13 * * 1-5" # 19:00 IST on weekdays, after NSE close: prices, indicators, news
    - cron: "30 3 * * 6"    # 09:00 IST Saturday: everything, including company fundamentals
  workflow_dispatch: {}

concurrency:
  group: nightly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USE_SQLITE: "false"
      SCHEDULER_ENABLED: "false"
      SKIP_FUNDAMENTALS: ${{ github.event.schedule == '30 13 * * 1-5' && 'true' || 'false' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/sync_all.py
